name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fleetguard-fixtures
      - uses: actions/checkout@v4
        with:
          repository: fleetguard-labs/fleetguard-analyzer
          path: fleetguard-analyzer
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: fleetguard-fixtures
